name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Inspect Workspace Structure
        run: |
          echo "=== Root Files ==="
          ls -la
          echo "=== Finding gradlew ==="
          find . -name "gradlew" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant Execute Permission & Build
        run: |
          # Agar gradlew root par ho ya subfolder me, auto-detect karega
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLE_PATH" ]; then
            echo "ERROR: gradlew file nahi mili! Repo structure check karein."
            exit 1
          fi
          
          DIR_PATH=$(dirname "$GRADLE_PATH")
          echo "Navigating to: $DIR_PATH"
          cd "$DIR_PATH"
          
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyBox-Debug-APK
          path: "**/*.apk"
